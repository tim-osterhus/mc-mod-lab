name: toolkit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py
      - run: python scripts/package_plugin.py --out dist/mc-mod-lab.zip
      - run: python lab.py replay --out reports/ci-replay
      - run: python lab.py validate report reports/ci-replay/baseline/report.json --portable
      - run: python lab.py validate report reports/ci-replay/corrected/report.json --portable
      - run: python lab.py validate parity reports/ci-replay/parity.json --portable
      - name: Parse rebuild script without starting Java
        shell: pwsh
        run: |
          $labTokens = $null
          $labErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/harden-bridge.ps1), [ref]$labTokens, [ref]$labErrors)
          if ($labErrors.Count) { throw 'PowerShell syntax validation failed' }
